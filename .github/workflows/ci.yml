name: CI

# What runs here needs nothing that is kept out of the repository (the reference mirror `_mirror/`, the reference snapshots
# `design/reference/` and the licensed Rostelecom Basis font are git-ignored):
#   quality — ESLint, stylelint (no raw hex colours, ratchet), types of the library, unit/component tests, dependency audit;
#   build   — package build, barrel consistency, package lint, node-side checks (SSR, CSS guards), visual regression against OUR
#             OWN committed baselines (e2e/*-snapshots, created on Linux by the `visual-baseline` workflow), tarball artifact.
# The pixel comparison with the licensed reference (`tools/compare.py`) runs on a machine that has the reference.
# The tarball built here has NO fonts (licensed): the app that installs it provides RostelecomBasis-*.woff(2), see docs/PACKAGE.md.
#
# Also called by release.yml (workflow_call): a release cannot go out from a red commit.
#
# runs-on: [self-hosted, lct] — GitHub Actions billing на организацию отключён, ubuntu-latest падает
# за пару секунд без единого лога. Раннер flow3-1 (aarch64, тот же, что у backend/frontend/deploy) —
# Linux, поэтому визуальные baseline (visual-baseline.yml) остаются детерминированными относительно CI.

on:
  push:
    branches: [main]
  pull_request:
  workflow_call: {}
  workflow_dispatch:
    inputs:
      e2e:
        description: 'Also run the Python browser checks of the CRM (mobile) and charts (no licensed font on the runner, so layouts may differ; never blocks)'
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  quality:
    name: lint · types · tests
    runs-on: [self-hosted, lct]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: ESLint (ratchet - the warning budget lives in package.json)
        run: npm run lint

      - name: stylelint (no raw hex colours in component styles, ratchet)
        run: npm run lint:styles

      - name: Types of the library (src/lib; the playground routes and stories are not part of the package)
        run: npm run check:lib

      - name: Unit / component tests
        run: npm test

      - name: Dependency audit (runtime, high+)
        run: npm audit --omit=dev --audit-level=high

      - name: Trivy fs (vulnerabilities in lockfiles, secrets)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: vuln,secret
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          skip-dirs: node_modules,dist,build,.svelte-kit,coverage

  build:
    name: build · package · visual
    runs-on: [self-hosted, lct]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build the package (barrel, svelte-package, minified CSS, extension CSS guards)
        run: npm run package

      - name: The generated barrel is committed and up to date
        run: git diff --exit-code -- src/lib/index.ts

      - name: Package lint (publint + are-the-types-wrong)
        run: npm run package:check

      - name: Node-side checks (extension CSS, SSR of the extensions and of the charts)
        run: |
          node tools/check-ext-css.mjs
          node tools/check-ext-ssr.mjs
          node tools/check-charts-ssr.mjs

      - name: Visual baselines present?
        id: baselines
        run: |
          if compgen -G "e2e/*-snapshots/*.png" > /dev/null; then
            echo "have=true" >> "$GITHUB_OUTPUT"
          else
            echo "have=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=No visual baselines::run the 'visual-baseline' workflow, download the artifact and commit e2e/visual.spec.ts-snapshots (README, section 'CI и релизы'). Until then the visual check is skipped."
          fi

      - name: Browser for the visual check
        if: steps.baselines.outputs.have == 'true'
        run: npx playwright install --with-deps chromium

      - name: Visual regression against our own baselines
        if: steps.baselines.outputs.have == 'true'
        run: npm run test:visual

      - name: Visual diff report on failure
        if: failure() && steps.baselines.outputs.have == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: visual-diff
          path: |
            test-results/
            playwright-report/
          retention-days: 14

      - name: Pack the tarball
        run: |
          mkdir -p out
          npm pack --ignore-scripts --pack-destination out
          ls -la out

      - name: Note about fonts
        run: echo "::notice title=No fonts in this tarball::Rostelecom Basis is licensed and git-ignored; the app that installs the package provides the font files (docs/PACKAGE.md)."

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rt-ui-package
          path: out/*.tgz
          if-no-files-found: error
          retention-days: 30

  e2e:
    # manual: Actions -> CI -> Run workflow -> e2e. Informational only (the real font is missing on the runner).
    if: github.event_name == 'workflow_dispatch' && inputs.e2e
    needs: build
    runs-on: [self-hosted, lct]
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - run: npm ci

      - name: Browser + Python Playwright
        run: |
          pip install playwright pillow numpy
          python -m playwright install --with-deps chromium

      - name: Start the playground
        run: |
          npm run dev > dev.log 2>&1 &
          for _ in $(seq 1 60); do curl -sf http://127.0.0.1:5180/ > /dev/null && break; sleep 2; done
          curl -sf http://127.0.0.1:5180/examples/crm > /dev/null

      - name: "CRM: phone / tablet / desktop"
        run: python tools/check-crm-mobile.py --themes rtk_default_light

      - name: Charts
        run: python tools/check-charts.py --quick --no-shots

      - name: Dev server log on failure
        if: failure()
        run: tail -n 80 dev.log
