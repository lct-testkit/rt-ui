name: Release

# Push a tag `v0.1.1` (it must match "version" in package.json) -> the package tarball is attached to a GitHub Release.
# The package is PRIVATE (licensed font and brand assets): keep the repository private, do not publish to the public npm registry.
# The tarball has no fonts (git-ignored): the installing app provides them, see docs/PACKAGE.md.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: The tag matches package.json
        run: |
          v="v$(node -p "require('./package.json').version")"
          if [ "$v" != "$GITHUB_REF_NAME" ]; then echo "::error::tag $GITHUB_REF_NAME != package.json version $v"; exit 1; fi

      - run: npm run check:lib
      - run: npm run package
      - run: npm run package:check

      - name: Pack
        run: |
          mkdir -p out
          npm pack --ignore-scripts --pack-destination out
          ls -la out

      - name: GitHub Release with the tarball
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="Install with npm i ./lct-testkit-rt-ui-${GITHUB_REF_NAME#v}.tgz (private package; provide the Rostelecom Basis font files in the app, see docs/PACKAGE.md)."
          gh release create "$GITHUB_REF_NAME" out/*.tgz --title "$GITHUB_REF_NAME" --generate-notes --notes "$notes"
