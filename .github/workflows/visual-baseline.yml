name: visual-baseline

# Creates (or refreshes) the visual baselines of OUR OWN playground pages on the same runner that CI uses (self-hosted,
# aarch64 Linux, no licensed font — GitHub Actions billing отключён, ubuntu-latest не работает), so the comparison in
# ci.yml is deterministic. Baselines rendered on a developer's Windows/macOS machine, or on a different CPU arch, would
# never match reliably.
#
#   Actions -> visual-baseline -> Run workflow -> download the `visual-baselines` artifact ->
#   unpack into e2e/ (it contains visual.spec.ts-snapshots/) -> review the PNGs -> commit.
#
# The workflow never commits by itself: a human looks at the pictures before they become the reference.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  baseline:
    runs-on: [self-hosted, lct]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Не --with-deps: та же причина, что в ci.yml (self-hosted раннер, runner без sudo-пароля) —
      # системные библиотеки уже поставлены на машине заранее, здесь только бинарник браузера.
      - run: npx playwright install chromium

      - name: Render baselines
        run: npm run test:visual:update

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-baselines
          path: e2e/visual.spec.ts-snapshots/
          if-no-files-found: error
          retention-days: 14

      - name: How to use
        run: |
          {
            echo "### Visual baselines rendered"
            echo "Download the **visual-baselines** artifact, put its content into \`e2e/visual.spec.ts-snapshots/\`, review the PNGs and commit."
          } >> "$GITHUB_STEP_SUMMARY"
